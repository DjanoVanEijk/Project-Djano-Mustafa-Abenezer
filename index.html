<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Sale Webshop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="logo">Webshop</div>
    <input type="text" class="search-bar" placeholder="Zoeken naar producten...">
    <nav>
      <ul class="main-nav">
        <li><a href="#">Home</a></li>
        <li><a href="#">Aanbiedingen</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ============ COUNTDOWN TIMER (User Story 4) ============ -->
  <div class="countdown-timer" id="countdown">
    Aanbieding eindigt over: <span id="countdown-value">23:59:59</span>
  </div>

  <!-- ============ PRODUCT GRID (User Story 1) ============ -->
  <main class="product-grid">

    <div class="product-card">
      <img src="images/product1.jpg" alt="Naam van product 1" class="product-card__image">
      <div class="product-card__info">
        <p class="product-card__name">Koptelefoon</p>
        <p class="product-card__price">€ 29,99</p>
        <span class="stock-badge">Nog maar 2 op voorraad</span><br>
        <button class="btn btn-primary add-to-cart">In winkelwagen</button>
      </div>
    </div>

    <div class="product-card">
      <img src="images/product2.jpg" alt="Naam van product 2" class="product-card__image">
      <div class="product-card__info">
        <p class="product-card__name">Zonnebril</p>
        <p class="product-card__price">€ 19,99</p>
        <span class="stock-badge">Op voorraad</span><br>
        <button class="btn btn-primary add-to-cart">In winkelwagen</button>
      </div>
    </div>

    <div class="product-card">
      <img src="images/product3.jpg" alt="Naam van product 3" class="product-card__image">
      <div class="product-card__info">
        <p class="product-card__name">Sneaker</p>
        <p class="product-card__price">€ 44,99</p>
        <span class="stock-badge">Op voorraad</span><br>
        <button class="btn btn-primary add-to-cart">In winkelwagen</button>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
