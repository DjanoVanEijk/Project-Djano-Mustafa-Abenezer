<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Sale Webshop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">Webshop</a>

    <form class="search" action="productpagina.html" method="get">
      <input type="search" class="search-bar" name="q" placeholder="Zoeken naar producten..." aria-label="Zoeken naar producten">
      <button class="btn-search" type="submit">Zoek</button>
    </form>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="productpagina.html">Producten</a>
      <a href="contactpagina.html">Contact</a>
    </nav>
  </header>

  <main class="product-page">

    <div class="filter-container">
      <button class="filter-btn active" data-filter="all">Alle producten</button>
      <button class="filter-btn" data-filter="who-is-he">"who is he?"</button>
      <button class="filter-btn" data-filter="mystery">"???"</button>
      <button class="filter-btn" data-filter="sonion">"sonion"</button>
    </div>

    <div class="product-list">
      <p id="no-results-message">Geen producten gevonden.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
